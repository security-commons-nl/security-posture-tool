version: 2
updates:
  # Python dependencies in v0.1/
  - package-ecosystem: "pip"
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    directory: "/v0.1"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"

  # Er zijn inmiddels workflows, dus github-actions doet weer mee. De reden om het
  # eerder weg te laten (geen workflows, dus spurious failure-runs) geldt niet meer.
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "ci"]
