name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Het token van deze workflow mag alleen lezen. Dat is nu ook de standaard van de
# organisatie, maar expliciet blijft het staan als die standaard ooit verandert.
permissions:
  contents: read

jobs:
  # Tests in v0.1/tests via de herbruikbare workflow. Draaide eerder alleen
  # py_compile omdat de suite nog niet bestond; die is er nu wel.
  v01-tests:
    uses: security-commons-nl/.github/.github/workflows/python-ci.yml@main
    with:
      python-version: "3.12"
      working-directory: "v0.1"
      test-command: "pytest tests/ -v"
